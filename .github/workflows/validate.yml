name: Check dotfiles
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck neovim
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check shell scripts
        run: |
          shellcheck scripts/* dev/*.sh tests/*.sh home/dot_local/bin/executable_dev
          zsh -n home/dot_zshrc
      - name: Check real chezmoi deployment
        run: python3 tests/check.py
      - name: Check Fedora desktop configuration
        run: |
          docker run --rm -i -v "$PWD:/dotfiles:ro" --entrypoint bash \
            quay.io/fedora-ostree-desktops/sway-atomic:45 < tests/desktop.sh
  development-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker build -t dotfiles-dev:check -f dev/Containerfile dev
      - name: Check development tools
        run: |
          docker run --rm --entrypoint bash dotfiles-dev:check -lc \
            'asdf version && uv --version && cc --version && c++ --version && cmake --version && nvim --version'
