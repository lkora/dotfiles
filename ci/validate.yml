name: Validate Dotfiles

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-check:
    name: Check Directory Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Smoke Tests
        run: |
          chmod +x ./tests/smoke/check-structure.sh
          ./tests/smoke/check-structure.sh || exit 1

  config-validation:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          chmod +x ./tests/unit/check-config.sh
          ./tests/unit/check-config.sh || exit 1

      - name: Run LazyVim Tests
        run: |
          chmod +x ./tests/unit/check-lazyvim.sh
          # Note: This test requires nvim installed
          # Skipping for CI to avoid dependency issues
          # ./tests/unit/check-lazyvim.sh || exit 1
          echo "LazyVim test skipped (requires nvim)"

  sync-validation:
    name: Test Dotfiles Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Integration Tests
        run: |
          mkdir -p /tmp/mock-user
          chown -R root:root /tmp/mock-user

          chmod +x ./tests/integration/check-sync.sh
          sudo -E bash ./tests/integration/check-sync.sh || exit 1

  build-validation:
    name: Validate Bootstrap Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Bootstrap Script
        run: |
          chmod +x ./boot/bootstrap.sh

          if grep -q "set +e" ./boot/bootstrap.sh; then
            echo "⚠️  Warning: set +e found - error handling may be disabled"
          fi

          if ! grep -q "set -euo pipefail" ./boot/bootstrap.sh; then
            echo "⚠️  Warning: Strict mode not enabled"
          fi

          echo "Bootstrap script structure validated"

  version-check:
    name: Validate Version Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Version File
        run: |
          if [[ -f ./meta/version.json ]]; then
            echo "Found version.json"
            cat ./meta/version.json
          else
            echo "⚠️  version.json not found"
          fi

          if [[ -f ./meta/changelog.md ]]; then
            echo "Found changelog.md"
          else
            echo "⚠️  changelog.md not found"
          fi

  lazyvim-config-check:
    name: Validate LazyVim Config Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check LazyVim Config
        run: |
          # Verify config files exist
          if [[ -f ./configs/nvim/lua/config/init.lua ]]; then
            echo "✓ LazyVim init.lua exists"
          else
            echo "⚠️  LazyVim init.lua not found"
          fi

          if [[ -f ./configs/nvim/lua/lazyvim/config/lspconfig.lua.local ]]; then
            echo "✓ LazyVim local override exists"
          else
            echo "⚠️  LazyVim local override not found"
          fi

          if [[ -f ./scripts/fetch-lazyvim-config.sh ]]; then
            echo "✓ LazyVim fetch script exists"
          else
            echo "⚠️  LazyVim fetch script not found"
          fi
